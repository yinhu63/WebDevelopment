<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NYC Collision Data</title>
  <link href="style.css" rel="stylesheet">
  <script src="script.js"></script>
</head>

<body onload="init()">

  <div id="banner" class="container center">
    <div style="text-align:center">
      <h1>NYC Collision Data</h1>
    </div>
  </div>

  <div style="padding:20px">
    <h3>Search By Borough</h3>
    <input type="text" id="borough" placeholder="Enter Borough">

    <h3>Search By Vehicle</h3>
    <input type="text" id="vehicle" placeholder="Enter Vehicle Type">

    <br><br>
    <a class="button" onclick="filterByBorough()">Search</a>
    <hr>
  </div>

  <div id="result" class="container"></div>

  <div id="output" class="container"></div>

</body>
</html>
